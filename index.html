<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shadow Knight Game Zone – Instant 3D Web &amp; Arcade Gaming Portal</title>
    <meta
      name="description"
      content="Play instant 3D action, arcade reflex, and racing web games in 16:9 landscape mode on Shadow Knight Game Zone. Install as a fast offline-ready PWA."
    />
    <meta
      name="keywords"
      content="Shadow Knight Game Zone, 3D web games, HTML5 arcade games, browser gaming portal, PWA games, mobile landscape games"
    />
    <meta name="author" content="Shadow Knight Game Zone" />
    <meta name="robots" content="index, follow" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shadow Knight Game Zone" />
    <meta property="og:title" content="Shadow Knight Game Zone – Instant 3D Web &amp; Arcade Gaming Portal" />
    <meta
      property="og:description"
      content="Play instant 3D action, arcade reflex, and racing web games in 16:9 landscape mode on Shadow Knight Game Zone."
    />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shadow Knight Game Zone – Instant 3D Web &amp; Arcade Gaming Portal" />
    <meta
      name="twitter:description"
      content="Play instant 3D action, arcade reflex, and racing web games in 16:9 landscape mode on Shadow Knight Game Zone."
    />
    <meta name="twitter:image" content="/logo.png" />

    <!-- PWA & iOS Safari Meta Tags -->
    <meta name="theme-color" content="#07070F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShadowKnight" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="alternate icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Google Fonts: Orbitron, Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Shadow Knight Game Zone",
        "applicationCategory": "GameApplication",
        "operatingSystem": "All",
        "description": "Mobile-first 3D web gaming portal and Progressive Web App featuring instant arcade, action, and racing games.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Shadow Knight Game Zone"
        }
      }
    </script>
  </head>
  <body class="bg-[#07070F] text-slate-100 antialiased selection:bg-[#FF1E42]/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
